# Configuración del puerto para Render
server.port=${PORT:8080}

# 1. Configuración de la conexión a Aiven MySQL
# Se usa el hostname para validación SSL correcta y parámetros de timeout para evitar desconexiones en Render
spring.datasource.url=jdbc:mysql://mysqlrubberduck-76f643a-rubberducksurveys-d4c4.e.aivencloud.com:27386/defaultdb?sslMode=REQUIRED&trustServerCertificate=true&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=60000
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}

# 2. Optimización de HikariCP para Render (512MB RAM)
# Reducimos el pool para ahorrar memoria y añadimos keep-alive para evitar el SocketTimeout
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=60000

# 3. Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
