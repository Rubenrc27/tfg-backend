<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RubberDuckSurveys — Feedback anónimo corporativo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --blue: #2B5A8C;
        --blue-dark: #1e4268;
        --yellow: #F1C40F;
        --yellow-dark: #d4aa0c;
        --bg: #F4F1EA;
        --white: #ffffff;
        --text: #1a1a1a;
        --muted: #666;
        --border: #e8e4da;
        --navy: #1a1a2e;
      }

      html { scroll-behavior: smooth; }
      body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

      /* ── NAV ── */
      nav {
        position: sticky; top: 0; z-index: 100;
        background: rgba(244,241,234,0.92); backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 1rem 2rem;
        display: flex; align-items: center; justify-content: space-between;
      }
      .nav-logo { font-family: 'DM Serif Display', serif; font-size: 1.25rem; color: var(--text); display: flex; align-items: center; gap: 10px; text-decoration: none; }
      .duck-pill { width: 32px; height: 32px; background: var(--yellow); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
      .nav-links { display: flex; align-items: center; gap: 1.75rem; }
      .nav-link { font-size: 14px; color: var(--muted); text-decoration: none; font-weight: 500; transition: color .2s; }
      .nav-link:hover { color: var(--blue); }
      .btn-nav { background: var(--yellow); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; padding: 9px 22px; border-radius: 50px; border: none; cursor: pointer; transition: background .15s, transform .15s; text-decoration: none; display: inline-block; }
      .btn-nav:hover { background: var(--yellow-dark); transform: translateY(-1px); }

      /* ── HERO ── */
      .hero {
        background: var(--bg); padding: 5rem 2rem 0;
        display: flex; flex-direction: column; align-items: center; text-align: center;
        position: relative;
      }
      .hero-eyebrow {
        background: var(--yellow); color: #5a4200;
        font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
        padding: 5px 16px; border-radius: 20px; margin-bottom: 1.75rem;
        display: inline-flex; align-items: center; gap: 6px;
        animation: fadeDown .5s ease both;
      }
      .hero h1 {
        font-family: 'DM Serif Display', serif;
        font-size: clamp(2.4rem, 6vw, 4.2rem); line-height: 1.1;
        color: var(--text); max-width: 740px; margin-bottom: 1.5rem;
        animation: fadeUp .6s .1s ease both;
      }
      .hero h1 em { font-style: italic; color: var(--blue); }
      .hero-sub {
        font-size: 1.05rem; color: var(--muted); max-width: 480px; line-height: 1.8;
        margin-bottom: 1.25rem;
        animation: fadeUp .6s .2s ease both;
      }
      .anon-badge {
        display: inline-flex; align-items: center; gap: 7px;
        background: #e3edf8; color: var(--blue);
        font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 20px;
        margin-bottom: 2rem;
        animation: fadeUp .6s .25s ease both;
      }
      .hero-cta { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 3.5rem; animation: fadeUp .6s .3s ease both; }
      .btn-primary {
        background: var(--blue); color: #fff;
        font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
        padding: 13px 30px; border-radius: 50px; border: none; cursor: pointer;
        transition: background .15s, transform .15s; box-shadow: 0 4px 20px rgba(43,90,140,.25);
        text-decoration: none; display: inline-block;
      }
      .btn-primary:hover { background: var(--blue-dark); transform: translateY(-2px); }
      .btn-ghost {
        background: transparent; color: var(--blue);
        font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
        padding: 13px 30px; border-radius: 50px; border: 1.5px solid var(--blue); cursor: pointer;
        transition: background .15s; text-decoration: none; display: inline-block;
      }
      .btn-ghost:hover { background: #e9f0f8; }

      /* Phone mockup */
      .phone-wrap { animation: floatUp .7s .4s ease both; }
      .phone-mockup {
        width: min(310px, 90vw);
        background: #111827; border-radius: 36px; border: 6px solid #0a0f1a;
        padding: .9rem; margin: 0 auto;
        box-shadow: 0 40px 80px rgba(0,0,0,.22), 0 0 0 1px rgba(255,255,255,.04);
      }
      .phone-screen { background: #F9F9FC; border-radius: 26px; overflow: hidden; }
      .pbar { background: var(--blue); padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; }
      .pbar-title { color: #fff; font-size: 15px; font-weight: 600; }
      .pbar-duck { width: 30px; height: 30px; background: var(--yellow); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; }
      .pcontent { padding: 14px; }
      .plabel { font-size: 10px; color: #999; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
      .pcard { background: #fff; border-radius: 12px; padding: 11px 13px; margin-bottom: 9px; border: 1px solid #eaeaea; }
      .ptag { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; display: inline-block; margin-bottom: 5px; }
      .ptag-c { background: #e3edf8; color: var(--blue); }
      .ptag-p { background: #fef6d1; color: #8a6800; }
      .ptitle { font-size: 12.5px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
      .pmeta { font-size: 11px; color: #aaa; display: flex; align-items: center; gap: 5px; }
      .ydot { width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); display: inline-block; }
      .pnav { background: #fff; border-top: 1px solid #eaeaea; padding: 8px 0 5px; display: flex; justify-content: space-around; }
      .pni { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9.5px; color: #bbb; }
      .pni.on { color: var(--blue); }
      .pni-ic { font-size: 16px; }

      /* ── WAVE ── */
      .wave-section { background: var(--blue); margin-top: -1px; }
      .wave-top { display: block; width: 100%; }

      /* ── HOW IT WORKS ── */
      .how { background: var(--blue); padding: 1rem 2rem 4rem; }
      .how-inner { max-width: 840px; margin: 0 auto; text-align: center; }
      .sec-label-inv { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: rgba(241,196,15,.85); background: rgba(241,196,15,.15); display: inline-block; padding: 4px 14px; border-radius: 20px; margin-bottom: 1rem; }
      .sec-title-inv { font-family: 'DM Serif Display', serif; font-size: clamp(1.8rem, 3.5vw, 2.6rem); color: #fff; margin-bottom: 2.5rem; }
      .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1.5rem; }
      .step { text-align: center; }
      .step-num { width: 44px; height: 44px; border-radius: 50%; background: var(--yellow); color: #2B5A8C; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; margin: 0 auto .9rem; }
      .step h3 { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 5px; }
      .step p { font-size: 12.5px; color: rgba(255,255,255,.6); line-height: 1.65; }

      /* ── FEATURES ── */
      .features { background: var(--bg); padding: 5rem 2rem; }
      .features-inner { max-width: 840px; margin: 0 auto; }
      .sec-label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--yellow); background: var(--blue); display: inline-block; padding: 4px 14px; border-radius: 20px; margin-bottom: 1rem; }
      .sec-title { font-family: 'DM Serif Display', serif; font-size: clamp(1.8rem, 3.5vw, 2.5rem); color: var(--text); margin-bottom: .75rem; line-height: 1.2; }
      .sec-sub { font-size: 1rem; color: var(--muted); line-height: 1.8; max-width: 500px; margin-bottom: 2.5rem; }
      .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; }
      .fcard { background: var(--white); border-radius: 18px; padding: 1.5rem; border: 1px solid var(--border); transition: transform .2s, box-shadow .2s; }
      .fcard:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,.06); }
      .ficon { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 1rem; }
      .fi1 { background: #e3edf8; }
      .fi2 { background: #fef6d1; }
      .fi3 { background: #e2f4ec; }
      .fi4 { background: #fde8f0; }
      .fi5 { background: #ede8fe; }
      .fi6 { background: #fff3e0; }
      .fcard h3 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
      .fcard p { font-size: 13px; color: #777; line-height: 1.65; }

      /* ── STATS ── */
      .stats { background: var(--navy); padding: 3.5rem 2rem; }
      .stats-inner { max-width: 700px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1.5rem; }
      .stat { text-align: center; }
      .stat-num { font-family: 'DM Serif Display', serif; font-size: 2.8rem; color: var(--yellow); line-height: 1; }
      .stat-label { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 6px; text-transform: uppercase; letter-spacing: .09em; }

      /* ── TESTIMONIALS ── */
      .testimonials { background: var(--bg); padding: 5rem 2rem; }
      .test-inner { max-width: 840px; margin: 0 auto; }
      .tgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; margin-top: 2rem; }
      .tcard { background: var(--white); border-radius: 18px; padding: 1.5rem; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 1rem; }
      .tquote { font-size: 14px; color: #444; line-height: 1.75; font-style: italic; }
      .tauthor { display: flex; align-items: center; gap: 10px; }
      .av { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
      .av1 { background: #e3edf8; color: var(--blue); }
      .av2 { background: #fef6d1; color: #8a6800; }
      .av3 { background: #e2f4ec; color: #1a6e3e; }
      .aname { font-size: 13px; font-weight: 600; color: var(--text); }
      .arole { font-size: 11px; color: #999; }

      /* ── CTA ── */
      .cta-section { background: var(--bg); padding: 6rem 2rem; text-align: center; position: relative; overflow: hidden; }
      .cta-section::before { content: ''; position: absolute; top: -120px; left: 50%; transform: translateX(-50%); width: 600px; height: 600px; background: radial-gradient(circle, rgba(241,196,15,.12) 0%, transparent 70%); pointer-events: none; }
      .big-duck { font-size: 72px; display: block; margin-bottom: 1rem; animation: wobble 3s ease-in-out infinite; }
      .cta-inner { max-width: 580px; margin: 0 auto; position: relative; }
      .cta-title { font-family: 'DM Serif Display', serif; font-size: clamp(2rem, 4vw, 2.8rem); color: var(--text); margin-bottom: 1rem; line-height: 1.2; }
      .cta-sub { color: var(--muted); font-size: 1rem; margin-bottom: 2.25rem; line-height: 1.8; }
      .cta-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

      /* ── FOOTER ── */
      footer { background: var(--navy); padding: 2.5rem 2rem; text-align: center; }
      .flogo { font-family: 'DM Serif Display', serif; font-size: 1.3rem; color: var(--yellow); display: inline-flex; align-items: center; gap: 8px; margin-bottom: .5rem; }
      .ftagline { font-size: 12px; color: rgba(255,255,255,.35); }
      .fcopy { font-size: 11px; color: rgba(255,255,255,.18); margin-top: 1.25rem; }

      /* ── ANIMATIONS ── */
      @keyframes fadeDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
      @keyframes floatUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
      @keyframes wobble { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

      /* ── RESPONSIVE ── */
      @media (max-width: 600px) {
        .nav-links .nav-link { display: none; }
        .hero h1 { font-size: 2.2rem; }
        .steps { grid-template-columns: 1fr 1fr; }
      }
    </style>
</head>
</html>
